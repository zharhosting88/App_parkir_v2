<!DOCTYPE html>
<html lang="id">
<head>
<title>Lihat Data - Parkir Digital</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
:root {
      --bg: #080c18;
      --card: rgba(17, 24, 43, 0.88);
      --primary: #6366f1;
      --secondary: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.16);
}
body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:
        radial-gradient(ellipse at 15% 15%, #312e8138, transparent 40%),
        radial-gradient(ellipse at 85% 85%, #7c3aed26, transparent 40%),
        var(--bg);
  color:#fff;
}
  
.bg-video{ position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: -2;}
    body::before{ content: ""; position: fixed; inset: 0; background:
        radial-gradient(ellipse at 15% 15%, #312e8138, transparent 40%),
        radial-gradient(ellipse at 85% 85%, #7c3aed26, transparent 40%),
        var(--bg); z-index: -1;}


header{
  position:sticky;
  top:0;
  z-index:901; 
  padding:16px;
  text-align:center;
  background-image:url('https://i.imgur.com/SpSkvE8.jpeg'); background-position: center; background-color: rgba(0,0,0,.6);
  background-blend-mode: multiply; background-size: cover;
  border-bottom:1px solid rgba(255,255,255,.05);
  font-family:Orbitron,sans-serif;
}
.hamburger{
  position:absolute;
  top:14px;
  right:14px;
  font-size:24px;
  cursor:pointer;
  background:#0f172a;
  padding:8px 14px;
  border-radius:12px;
  z-index:999; 
}

#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  z-index:900; 
}

#sideNav{
  position:fixed;
  top:0;
  right:-270px;
  width:260px;
  height:100%;
  background:#020617;
  padding:20px;
  transition:.35s;
  border-left:1px solid rgba(255,255,255,.05);
  z-index:901; 
}
#sideNav button{
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  background:#0f172a;
  border:none;
  color:#38bdf8;
  text-align:left;
  border-radius:12px;
  cursor:pointer;
}

.menu{
  display:flex;
  gap:8px;
  padding:12px;
  overflow-x:auto;
}
.menu button{
  flex-shrink:0;
  padding:10px 14px;
  border:none;
  border-radius:12px;
  background:#0f172a;
  color:#38bdf8;
  cursor:pointer;
}
.menu button.active{
  background:#38bdf8;
  color:#020617;
  font-weight:600;
}

.card{
  margin:14px;
  background:#0f172a;
  border-radius:18px;
  padding:14px;
  overflow:auto;
  z-index:1;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
th{color:#38bdf8}
  .empty{
  text-align:center;
  opacity:.7;
  padding:40px 10px;
  font-size:14px;
  line-height:1.6;
}
  h3{
  text-align:center;
  margin-bottom:14px;
  font-weight:600;
  letter-spacing:1px;
}
  .zhar-marquee {border-top:none; display: flex; justify-content: center; gap: 30px; margin-top: 0; padding: 8px; background:rgba(255,255,255,.08); background-position: bottom; background-color: rgba(0,0,0,.6);
    background-blend-mode: multiply; background-size: cover; font-family:'Orbitron', sans-serif;}
table button{
  background:#ef4444;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}
table button:hover{
  background:#dc2626;
}
</style>
</head>

<body>
<header>
  <h2>PARKIR DIGITAL</h2>
  <div class="hamburger" onclick="openNav()">☰</div>
</header>
  <nav class="zhar-marquee">
<marquee>HALAMAN LIHAT DATA</marquee>
  </nav>

<div id="overlay" onclick="closeNav()"></div>

<div id="sideNav">
  <button onclick="location.href='home_p.html'">HOME</button>
  <button onclick="location.reload()">LIHAT DATA</button>
  <button onclick="show('kendaraan')">KENDARAAN</button>
  <button onclick="show('transaksi')">TRANSAKSI</button>
  <button onclick="show('tarif')">TARIF</button>
  <button onclick="show('area')">AREA PARKIR</button>
  <button onclick="location.href='Login.html'">INPUT DATA LAGI</button>
  <button onclick="logout()">LOGOUT</button>
  <button onclick="location.href='https://wa.me/6285811570814'"><i class="fa-brands fa-whatsapp"></i> DEVELOPER</button>
</div>

<div class="card" id="content">
  <div class="empty">
    Silakan pilih menu data<br>
    Kendaraan, Transaksi, Tarif, atau Area Parkir<br><br>
    <i style="font-size:10px;">copyright@Rpl-Tp2026</i>
  </div>
</div>
  
<script>
function hapusData(type, index){
  if(!confirm("Yakin hapus data ini?")) return;

  let data = JSON.parse(localStorage.getItem(type)) || [];
  data.splice(index, 1); 
  localStorage.setItem(type, JSON.stringify(data));

  show(type); 
}
  
function openNav(){
  sideNav.style.right="0";
  overlay.style.display="block";
}
function closeNav(){
  sideNav.style.right="-270px";
  overlay.style.display="none";
}
function logout(){
  location.href="Login.html";
}

const content=document.getElementById("content");
const btns=document.querySelectorAll(".menu button");

function show(type,el){
  if(el){
    btns.forEach(b=>b.classList.remove("active"));
    el.classList.add("active");
  }
  closeNav();

  let data=JSON.parse(localStorage.getItem(type))||[];
  if(!data.length){
    content.innerHTML=`<div class="empty">Data ${type} kosong</div>`;
    return;
  }

  if(type==="kendaraan"){
  content.innerHTML=`
  <h3>KENDARAAN</h3>
  <table>
    <tr>
      <th>ID</th><th>Plat</th><th>Jenis</th>
      <th>Warna</th><th>Pemilik</th><th>Aksi</th>
    </tr>
    ${data.map((d,i)=>`
      <tr>
        <td>${d.id}</td>
        <td>${d.plat}</td>
        <td>${d.jenis}</td>
        <td>${d.warna}</td>
        <td>${d.pemilik}</td>
        <td>
          <button onclick="hapusData('kendaraan',${i})">Hapus</button>
        </td>
      </tr>`).join("")}
  </table>`;
}

  if(type==="tarif"){
  content.innerHTML=`
  <h3>TARIF</h3>
  <table>
    <tr><th>ID</th><th>Jenis</th><th>Tarif/Jam</th><th>Aksi</th></tr>
    ${data.map((d,i)=>`
      <tr>
        <td>${d.id}</td>
        <td>${d.jenis}</td>
        <td>Rp ${Number(d.tarif).toLocaleString("id-ID")}</td>
        <td>
          <button onclick="hapusData('tarif',${i})">Hapus</button>
        </td>
      </tr>`).join("")}
  </table>`;
}

  if(type==="area"){
  content.innerHTML=`
  <h3>AREA PARKIR</h3>
  <table>
    <tr><th>ID</th><th>Nama</th><th>Kapasitas</th><th>Terisi</th><th>Aksi</th></tr>
    ${data.map((d,i)=>`
      <tr>
        <td>${d.id}</td>
        <td>${d.nama}</td>
        <td>${d.kapasitas}</td>
        <td>${d.terisi}</td>
        <td>
          <button onclick="hapusData('area',${i})">Hapus</button>
        </td>
      </tr>`).join("")}
  </table>`;
}

  if(type==="transaksi"){
  content.innerHTML=`
  <h3>TRANSAKSI</h3>
  <table>
    <tr>
      <th>ID Parkir</th>
      <th>ID Kendaraan</th>
      <th>Masuk</th>
      <th>Keluar</th>
      <th>Durasi</th>
      <th>Total</th>
      <th>Aksi</th>
    </tr>
    ${data.map((d,i)=>`
      <tr>
        <td>${d.id_parkir}</td>
        <td>${d.id_kendaraan}</td>
        <td>${d.waktu_masuk}</td>
        <td>${d.waktu_keluar}</td>
        <td>${d.durasi} jam</td>
        <td>Rp ${Number(d.total).toLocaleString("id-ID")}</td>
        <td>
          <button onclick="hapusData('transaksi',${i})">Hapus</button>
        </td>
      </tr>`).join("")}
  </table>`;
 }
}

</script>

</body>
</html>
